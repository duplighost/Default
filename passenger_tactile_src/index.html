<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#090612">
<title>Boon Moots</title>
<style>
:root{--bg:#05010c;--ink:#fff7ff;--muted:#cabee0;--line:rgba(255,255,255,.16);--hot:#ff2bd6;--cold:#00f5ff;--gold:#ffe66d;--green:#30ff87;--glass:rgba(10,6,18,.74);--shadow:0 16px 45px rgba(0,0,0,.45);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{height:100%;margin:0;overflow:hidden;background:radial-gradient(circle at 50% 35%,#3d1055 0%,#090612 52%,#020106 100%);color:var(--ink)}body{touch-action:none;overscroll-behavior:none;user-select:none}#game{position:fixed;inset:0;width:100vw;height:100vh;display:block;background:#05010c}.panel{background:linear-gradient(145deg,rgba(9,4,21,.72),rgba(46,10,58,.48));border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);backdrop-filter:blur(14px)}#hud{position:fixed;z-index:5;left:max(10px,env(safe-area-inset-left));top:max(8px,env(safe-area-inset-top));width:min(650px,calc(100vw - 20px));pointer-events:none}#topline{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px}#zone{font-weight:950;text-transform:uppercase;font-size:12px;letter-spacing:.04em;text-shadow:0 0 14px rgba(255,43,214,.42);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.topActions{display:flex;gap:6px;pointer-events:auto;flex-shrink:0}.miniBtn{appearance:none;border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:8px 10px;min-height:44px;color:#fff;background:rgba(255,255,255,.07);font:800 12px inherit;cursor:pointer}#stats{display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1fr;gap:6px;padding:0 10px 10px;font-size:12px;color:var(--muted)}.pill{border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.055);border-radius:999px;padding:6px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#hp{color:#ff9bbc;letter-spacing:.06em}#score{color:#fff}#combo{color:var(--gold);font-weight:950}#pulse{grid-column:1/-1;height:9px;border-radius:999px;overflow:hidden;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.10)}#pulseFill{height:100%;width:0;background:linear-gradient(90deg,var(--hot),var(--cold),var(--gold));transition:width .12s linear}#whisper{position:fixed;z-index:8;left:50%;top:calc(max(82px,env(safe-area-inset-top) + 76px));transform:translate(-50%,-8px);opacity:0;width:min(760px,calc(100vw - 24px));padding:11px 14px;text-align:center;pointer-events:none;transition:opacity .2s,transform .2s;background:rgba(8,5,14,.78);border:1px solid rgba(255,255,255,.16);border-radius:999px;box-shadow:var(--shadow);backdrop-filter:blur(12px);font-weight:900;font-size:13px;color:#fff}#whisper.show{opacity:1;transform:translate(-50%,0)}#overlay,#upgrade,#codex{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:max(18px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));background:radial-gradient(circle at 50% 32%,rgba(110,42,142,.36),rgba(2,1,8,.88) 62%,#020106 100%)}#overlay.show,#upgrade.show,#codex.show{display:flex}.modal{position:relative;width:min(880px,calc(100vw - 28px));padding:24px}.modal::before{content:'';position:absolute;inset:-1px;border-radius:19px;padding:1px;background:linear-gradient(145deg,rgba(255,43,214,.28),rgba(0,245,255,.18),transparent 60%);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}#overlayTitle{font-size:clamp(52px,10vw,118px);line-height:.88;letter-spacing:-.075em;text-transform:uppercase;text-shadow:0 0 40px rgba(255,43,214,.55),0 0 80px rgba(0,245,255,.25);margin:0 0 12px}#overlayCopy{font-size:16px;color:#f1e4ff;max-width:70ch;line-height:1.55;white-space:pre-line;text-shadow:0 0 12px rgba(0,245,255,.18)}.buttonRow{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}.bigBtn,.upgradeCard{appearance:none;border:1px solid rgba(255,255,255,.18);color:#fff;background:rgba(255,255,255,.08);border-radius:999px;padding:13px 15px;min-height:44px;font:900 14px inherit;cursor:pointer}.bigBtn:first-child{background:linear-gradient(135deg,rgba(255,43,214,.95),rgba(0,245,255,.72));color:#16061d;border:0}#upgrade .modal{width:min(980px,calc(100vw - 28px))}#upgradeTitle{margin:0 0 14px;font-size:clamp(24px,4.6vw,48px);letter-spacing:-.045em}#upgradeCards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.upgradeCard{border-radius:22px;text-align:left;padding:16px;min-height:164px;background:linear-gradient(145deg,rgba(255,255,255,.13),rgba(255,255,255,.045));box-shadow:var(--shadow)}.upgradeCard .uIcon{font-size:34px;margin-bottom:8px}.upgradeCard b{display:block;font-size:18px;margin-bottom:7px}.upgradeCard p{margin:0;color:#d9cce8;line-height:1.35;font-size:13px}#codex{z-index:21;align-items:stretch;overflow:auto}#codex .modal{width:min(960px,calc(100vw - 24px));max-height:calc(100vh - 40px);overflow:auto;padding:20px}#codex h2{font-size:34px;margin:0 0 10px;letter-spacing:-.045em}#codex h3{margin:18px 0 8px}#codex p,#codex li{color:#e8dcf3;line-height:1.45}.codexGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}.codexCard{padding:12px;border-radius:16px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.055)}.codexCard b{display:block;margin-bottom:4px}#pause,#shrine{position:fixed;inset:0;z-index:22;display:none;align-items:center;justify-content:center;padding:max(18px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));background:radial-gradient(circle at 50% 32%,rgba(110,42,142,.36),rgba(2,1,8,.88) 62%,#020106 100%)}#pause.show,#shrine.show{display:flex}#shrine .modal{width:min(960px,calc(100vw - 24px));max-height:calc(100vh - 40px);overflow:auto;padding:20px}.shrineCard{padding:14px;border-radius:16px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.055);cursor:pointer;text-align:left;min-height:110px}.shrineCard:hover{border-color:rgba(255,255,255,.3);background:rgba(255,255,255,.09)}.shrineCard b{display:block;margin-bottom:4px}.shrineCard p{margin:0;color:#d9cce8;line-height:1.35;font-size:13px}.shrineCard .sCost{color:#ffe66d;font-weight:900;font-size:13px;margin-top:6px}.shrineCard.owned{border-color:rgba(48,255,135,.3);background:rgba(48,255,135,.06)}.shrineCard.owned .sCost{color:#30ff87}@media(max-width:720px){#hud{width:auto;max-width:calc(100vw - 20px);opacity:.82}#topline{padding:6px 10px}#zone{display:none}.miniBtn{font-size:11px;padding:8px 8px}#stats{grid-template-columns:1fr;font-size:11px;gap:5px}#score,#room,#combo{display:none}#whisper{top:calc(max(84px,env(safe-area-inset-top) + 82px));border-radius:18px}.modal{padding:18px}#overlayCopy{font-size:14px}#upgradeCards{grid-template-columns:1fr}.upgradeCard{min-height:118px}}@media(max-height:520px) and (orientation:landscape){#hud{width:min(540px,calc(100vw - 20px));opacity:1}#topline{display:flex}#stats{grid-template-columns:repeat(5,1fr);font-size:10px}#score,#room,#combo{display:block}#pulse{display:none}#whisper{top:max(62px,env(safe-area-inset-top) + 58px)}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud" class="panel"><div id="topline"><div id="zone">Boon Moots</div><div class="topActions"><button class="miniBtn" id="soundBtn">sound on</button><button class="miniBtn" id="codexBtn">codex</button></div></div><div id="stats"><div class="pill" id="hp">♥♥♥♥♥</div><div class="pill" id="score">0</div><div class="pill" id="room">room 0</div><div class="pill" id="combo">two thumbs</div><div class="pill">pulse</div><div id="pulse"><div id="pulseFill"></div></div></div></div>
<div id="whisper"></div>
<div id="overlay"><div class="modal panel"><h1 id="overlayTitle"></h1><p id="overlayCopy"></p><div class="buttonRow" id="overlayButtons"></div></div></div>
<div id="upgrade"><div class="modal panel"><h2 id="upgradeTitle"></h2><div id="upgradeCards"></div></div></div>
<div id="codex"><div class="modal panel"><button class="miniBtn" id="closeCodex" style="float:right">close</button><h2>Boon Moots Codex / glovebox / tiny shrine</h2><div id="codexBody"></div></div></div>
<div id="pause"><div class="modal panel" style="text-align:center"><h2 style="font-size:clamp(28px,5vw,52px);letter-spacing:-.045em;margin:0 0 14px">Paused</h2><p style="color:#e8dcf3;margin:0 0 16px">The road waits.</p><div class="buttonRow" style="justify-content:center"><button class="bigBtn" id="resumeBtn">Resume</button><button class="bigBtn" id="pauseCodexBtn">Codex</button><button class="bigBtn" id="pauseSoundBtn">sound on</button></div></div></div>
<div id="shrine"><div class="modal panel"><button class="miniBtn" id="closeShrine" style="float:right">close</button><h2 style="font-size:clamp(24px,4.6vw,42px);letter-spacing:-.045em;margin:0 0 10px">Sparks Shrine</h2><p id="shrineSparks" style="color:#ffe66d;font-weight:900;font-size:18px;margin:0 0 14px"></p><div id="shrineCards" class="codexGrid"></div></div></div>
<script>window.BOON_MOOTS_SRC = './boon_moots_v2.webp';</script>
<script src="./game.js"></script>
</body>
</html>
